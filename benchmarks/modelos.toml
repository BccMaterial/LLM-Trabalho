[benchmark]
prompt = "prompts/atendente_v1.txt"
cases = "benchmarks/casos.json"
schema = "benchmarks/response.schema.json"
results_dir = "logs/model-benchmark"
max_model_calls = 5
max_tool_calls = 5
max_total_steps = 8
max_total_tokens = 6000
timeout_seconds = 120
max_output_tokens = 700
temperature = 0

[[models]]
name = "GPT-OSS 20B"
provider = "Groq API"
model_id = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
currency = "USD"
input_price_per_million = 0.075
output_price_per_million = 0.30
price_checked = "2026-11-14"
pricing_source = "https://console.groq.com/docs/model/openai/gpt-oss-20b"

[[models]]
name = "Qwen 3.8 27B"
provider = "Groq API (faixa gratuita com limites)"
model_id = "qwen/qwen3.8-27b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
currency = "USD"
input_price_per_million = 0.80
output_price_per_million = 4.00
price_checked = "2026-11-17"
pricing_source = "https://console.groq.com/docs/model/qwen/qwen3.8-27b"

[[models]]
name = "Gemini 3.5 Flash-Lite"
provider = "Gemini API (compatibilidade OpenAI)"
model_id = "gemini-3.5-flash-lite"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
currency = "USD"
# Tarifas da faixa gratuita; o custo estimado não considera limites de uso.
input_price_per_million = 0.0
output_price_per_million = 0.0
paid_input_price_per_million = 0.30
paid_output_price_per_million = 2.50
price_checked = "2026-11-17"
pricing_source = "https://ai.google.dev/gemini-api/docs/pricing"
