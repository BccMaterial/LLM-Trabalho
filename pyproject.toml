[project]
name = "llm-trabalho"
version = "0.1.0"
description = "Atendimento e apoio operacional para avaliações neuropsicológicas"
authors = [
    {name = "thiagopls1",email = "thiagopls1@hotmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "openai (>=3.16.2,<4.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "argon2-cffi (>=23.1.0,<26.0.0)",
    "langgraph (>=1.2.22,<2.0.0)",
    "chromadb (>=1.0.0,<2.0.0)",
    "sentence-transformers (>=3.0.0,<6.0.0)",
    "pydantic (>=2.0,<3.0)",
    "opentelemetry-api (==1.45.2)",
    "opentelemetry-sdk (==1.45.2)",
    "opentelemetry-exporter-otlp-proto-grpc (==1.45.2)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)"
]

[tool.isort]
profile = "black"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[tool.taskipy.tasks]
"dev" = "docker compose --env-file .env -f infra/compose.yaml up --build -d && poetry run task migrations:up"
"dev:api" = "python -m src.api.app"
"dev:agent" = "python -m src.agent.app"
"migrations:up" = "python scripts/migrations_up.py"
test = "python -m pytest"
"lint:fix" = "isort . && black ."
"lint:check" = "isort --check-only . && black --check ."

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
